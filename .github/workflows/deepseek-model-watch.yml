name: DeepSeek model watch

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  inspect-model-catalog:
    runs-on: ubuntu-latest
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Check monitor secret
        id: secret
        shell: bash
        run: |
          if [[ -n "$DEEPSEEK_API_KEY" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "DEEPSEEK_API_KEY is not configured; skipping model watch."
          fi
      - uses: actions/setup-python@v5
        if: ${{ steps.secret.outputs.enabled == 'true' }}
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime dependencies
        if: ${{ steps.secret.outputs.enabled == 'true' }}
        run: python -m pip install -e .
      - name: Read official model catalog
        if: ${{ steps.secret.outputs.enabled == 'true' }}
        id: catalog
        run: python scripts/check_deepseek_models.py
      - name: Create one review issue for a new catalog signature
        if: ${{ steps.catalog.outputs.unknown_count != '0' }}
        uses: actions/github-script@v7
        env:
          MODEL_REPORT: ${{ steps.catalog.outputs.report_json }}
        with:
          script: |
            const report = JSON.parse(process.env.MODEL_REPORT);
            const signature = report.unknown_models.join(', ');
            const title = `DeepSeek 模型目录待验证：${signature}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100,
            });
            if (issues.some(issue => issue.title === title)) return;
            const body = [
              '定时任务在 DeepSeek 官方模型目录中发现了尚未加入应用白名单的模型。',
              '',
              `- 待验证模型：${signature}`,
              `- 当前可用目录：${report.available_models.join(', ')}`,
              `- 检查时间：${report.fetched_at}`,
              '',
              '安全策略：不会自动启用未知模型。请先完成结构化输出、Token 用量、中文 JD 黄金集和回退测试，再更新白名单及优先级。',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            });
